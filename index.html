<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --grid: #16233b;
      --snake: #4ade80;
      --snake-head: #86efac;
      --food: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.02em; }
    .scorebar {
      display: flex;
      gap: 24px;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }
    .scorebar .label { color: var(--muted); }
    .stage { position: relative; }
    canvas {
      background: var(--panel);
      border-radius: 8px;
      display: block;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      /* M2-R3: let the swipe handlers own board gestures instead of the
         browser scrolling/zooming the page under the player's finger. */
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.82);
      border-radius: 8px;
      text-align: center;
    }
    .overlay[hidden] { display: none; }
    .overlay h2 { margin: 0; font-size: 1.6rem; }
    .overlay p { margin: 0; color: var(--muted); }
    button {
      font: inherit;
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      background: var(--snake);
      color: #06301b;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--snake-head); }
    .hint { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div class="scorebar">
    <div><span class="label">Score</span> <span id="score">0</span></div>
    <div><span class="label">Best</span> <span id="best">0</span></div>
  </div>
  <div class="stage">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay" hidden>
      <h2 id="overlay-title">Game over</h2>
      <p id="overlay-detail">Score: 0</p>
      <button id="restart" type="button">Restart</button>
      <p class="hint">or press Space / Enter</p>
    </div>
  </div>
  <p class="hint">Arrow keys or WASD to move — or swipe on a touchscreen</p>

  <script src="game.js"></script>
  <script src="bestscore.js"></script>
  <script>
    (function () {
      'use strict';

      var COLS = 20;
      var ROWS = 20;

      var canvas = document.getElementById('board');
      var ctx = canvas.getContext('2d');
      var cell = canvas.width / COLS; // Square cells; canvas is COLS*cell wide.

      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var overlay = document.getElementById('overlay');
      var overlayDetail = document.getElementById('overlay-detail');
      var restartBtn = document.getElementById('restart');

      var state = SnakeGame.createState(COLS, ROWS);
      var best = BestScore.loadBest(); // M2-R1: restore the persisted best.
      var timer = null;
      var tickMs = null; // current loop interval; tracks SnakeGame.tickInterval(score).

      var KEY_TO_DIR = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', s: 'down', a: 'left', d: 'right',
        W: 'up', S: 'down', A: 'left', D: 'right',
      };

      function draw() {
        ctx.fillStyle = getColor('--panel');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Subtle grid lines.
        ctx.strokeStyle = getColor('--grid');
        ctx.lineWidth = 1;
        for (var i = 1; i < COLS; i++) {
          line(i * cell, 0, i * cell, canvas.height);
        }
        for (var j = 1; j < ROWS; j++) {
          line(0, j * cell, canvas.width, j * cell);
        }

        // Food.
        drawCell(state.food.x, state.food.y, getColor('--food'));

        // Snake — head brighter than the body.
        for (var s = state.snake.length - 1; s >= 0; s--) {
          var color = s === 0 ? getColor('--snake-head') : getColor('--snake');
          drawCell(state.snake[s].x, state.snake[s].y, color);
        }
      }

      function line(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
      }

      function getColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function render() {
        scoreEl.textContent = state.score;    // M1-R3: live score.
        bestEl.textContent = best;
        draw();
      }

      function tick() {
        SnakeGame.step(state);
        render();
        if (state.over) {
          stop();
          showGameOver();
          return;
        }
        // M2-R2: eating raises the score, which shortens the interval. Reschedule
        // the loop whenever the score-driven interval changes (i.e. after a bite).
        var want = SnakeGame.tickInterval(state.score);
        if (want !== tickMs) {
          stop();
          tickMs = want;
          timer = setInterval(tick, tickMs);
        }
      }

      function showGameOver() {
        // M2-R1: persist a new best; saveBest only overwrites a lower record
        // and returns the resulting best for the DOM. Thread the current
        // in-memory best so a run never lowers it when storage reads fail
        // (private mode / blocked cookies) — see bestscore.js saveBest.
        best = BestScore.saveBest(state.score, undefined, best);
        bestEl.textContent = best;
        overlayDetail.textContent = 'Score: ' + state.score;
        overlay.hidden = false; // M1-R3: game-over affordance.
      }

      function start() {
        if (timer !== null) return;
        // M2-R2: seed the interval from the current score (base speed at 0).
        tickMs = SnakeGame.tickInterval(state.score);
        timer = setInterval(tick, tickMs);
      }

      function stop() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function restart() {
        stop();
        state = SnakeGame.createState(COLS, ROWS);
        overlay.hidden = true;
        render();
        start();
      }

      document.addEventListener('keydown', function (e) {
        if (state.over && (e.key === ' ' || e.key === 'Enter')) {
          e.preventDefault();
          restart();
          return;
        }
        var dir = KEY_TO_DIR[e.key];
        if (dir) {
          e.preventDefault(); // Stop arrow keys from scrolling the page.
          SnakeGame.setDirection(state, dir);
        }
      });

      // M2-R3: touch/swipe controls, so the game is playable on a touchscreen
      // with no keyboard. A swipe on the board steers the snake; keyboard and
      // touch both feed the same SnakeGame.setDirection buffer, so they can
      // never disagree, and a 180-degree swipe is rejected there for free.
      var SWIPE_MIN_PX = 24; // shorter drags are taps/jitter, not swipes.
      var touchStart = null;

      canvas.addEventListener('touchstart', function (e) {
        var t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        touchStart = { x: t.clientX, y: t.clientY };
        e.preventDefault(); // keep the board drag from scrolling the page.
      }, { passive: false });

      canvas.addEventListener('touchmove', function (e) {
        if (touchStart) e.preventDefault(); // hold the page still while steering.
      }, { passive: false });

      canvas.addEventListener('touchend', function (e) {
        if (!touchStart) return;
        var t = e.changedTouches && e.changedTouches[0];
        if (!t) { touchStart = null; return; }
        var dx = t.clientX - touchStart.x;
        var dy = t.clientY - touchStart.y;
        touchStart = null;
        var absX = Math.abs(dx);
        var absY = Math.abs(dy);
        if (absX < SWIPE_MIN_PX && absY < SWIPE_MIN_PX) return; // a tap, not a swipe.
        // The axis with the larger travel wins; ties fall to vertical.
        var dir = absX > absY ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
        e.preventDefault();
        SnakeGame.setDirection(state, dir);
      }, { passive: false });

      restartBtn.addEventListener('click', restart);

      render();
      start();
    })();
  </script>
</body>
</html>
