codecrew: "1.0" # protocol version (SPEC.md §5): a different major is refused; not the CLI release — see gh codecrew version
hub: self

# Role routing: who holds each role (SPEC §5). Declare all four at
# onboarding. ~ routes the role to you, the human operator; replace it with
# a GitHub App slug or a username to delegate, or an org/team-slug to
# route the role to any member of a GitHub team.
roles:
  implementer: { identity: radiusred-cody }
  reviewer: { identity: radiusred-checky }
  qa: { identity: radiusred-testy }
  doc-synthesizer: { identity: radiusred-wordy }
